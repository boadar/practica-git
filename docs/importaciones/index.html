<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{--ink:#282828;--azul:#009DDC;--azul2:#e6f6fc;--ama:#FFF200;--bg:#f3f4f6;--card:#fff;--line:#dfe3e8;--mut:#6b7280;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}

#lk .kpi{padding:9px 10px;text-align:right}#lk .kpi b{font-size:clamp(13px,1.4vw,19px)}#lk .kpi span{font-size:clamp(9px,.8vw,11px)}
@media (max-width:640px){#lk{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}#lk .kpi b{font-size:17px}#lk .kpi span{font-size:11px}}

tr.clk{cursor:pointer}
tr.marca td{background:#fff9b0}tr.pk{user-select:none}tr.clk.sel td{background:#fff9b0}tr.clk.sel td.hi{background:#ffee58}
#selBar{min-height:38px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}

tr.filtros input{padding:3px 6px;font-size:12px;min-width:90px;max-width:230px;font-weight:400}input.act,tr.filtros input.act{border-color:var(--azul);background:var(--azul2);font-weight:600}

input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul);outline-offset:-1px}
input[type=checkbox]{width:auto}

.chip.puer{background:#ede9fe;color:#5b21b6}.chip.alma{background:#dcfce7;color:#166534}.chip.cerr{background:#e5e7eb;color:#4b5563}

details.card>summary{list-style:none;cursor:pointer}details.card>summary::-webkit-details-marker{display:none}

/* tablas con columnas ancladas al desplazarse a la derecha (Analisis) */

/* Sales by product by month: maximo 10 lineas a la vista; el encabezado queda arriba y el total abajo al desplazarse */
.tw.alto10{max-height:430px;overflow-y:auto}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}

@media print{header,.bar,.btn,nav{display:none}body{background:#fff}.card{break-inside:avoid}}

<body>
<header>
  <h1><b>OFICA</b> · Control de Importaciones <small id="ver"></small></h1>
  <nav id="nav">
    <button data-v="tablero">Tablero</button>
    <button data-v="plan">Planificación</button>
    <button data-v="productos">Productos</button>
    <button data-v="analisis">Análisis</button>
    <button data-v="proveedores">Proveedores</button>
    <button data-v="respaldo">Respaldo</button>
  </nav>
</header>
<main id="main"></main>
<div id="toast"></div>

<script src="seed.js?v=39"></script>
<script src="plan_base.js?v=39"></script>
<script src="proformas.js?v=39"></script>
<script src="analisis_base.js?v=39"></script>
<script>
const VERSION = 'v39';   // al subir la version, subir tambien el ?v= de los <script> de datos
const KEY = 'importaciones_v1';
const TASAS_URL = 'https://boadar.github.io/reporte-cobranza/tasas.json';
// El lote avanza por estas etapas; en cada una se completa mas informacion
const ETAPAS = ['En planificación', 'En fabricación', 'Despachado / Navegando', 'En nacionalización', 'En almacén'];
const AYUDA = [
  'Productos a comprar al proveedor, cantidades por referencia y costos confirmados: con eso sale el costo de compra en origen.',
  'El proveedor está fabricando: orden de compra y datos de empaque.',
  'La carga salió: se informa el flete, el seguro y los datos del embarque.',
  'La carga llegó: tasa de aduana, impuestos, gastos locales y agente aduanal.',
  'La mercancía está en el almacén: el costo landed queda definitivo.'];
// estatus viejos (del Excel y de la v1-v2) -> etapa equivalente
function normEstatus(e){
  e = String(e || '');
  if (ETAPAS.includes(e)) return e;
  return ETAPAS[/monterrey|almac|cerr/i.test(e) ? 4 : /puerto|aduana|nacionaliz/i.test(e) ? 3 : /tr[aá]n|despach|naveg/i.test(e) ? 2 : /prod|fabric/i.test(e) ? 1 : 0];
}
const etapa = l => Math.max(0, ETAPAS.indexOf(l.estatus));
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function fechaEtapa(l, i){ const h = (l.historial || []).filter(x => x.estatus === ETAPAS[i]).pop(); return h ? h.fecha.split('-').reverse().join('/') : ''; }
// que informacion pide cada etapa y si ya esta cargada
function pendientes(l){
  const its = l.items || [], c = l.costos || {}, p = l.params || {}, todos = f => its.length > 0 && its.every(f);
  return [
    [['Proveedor', todos(i => provDe(l, i))], ['Productos con su referencia', todos(i => i.ref)], ['Cantidades por referencia', todos(i => N(i.cant) > 0)], ['Costos FOB confirmados', todos(i => N(i.fob) > 0)]],
    [['Orden de compra', !!l.oc], ['Piezas por caja (para los bultos)', todos(i => N(i.pzasCtn) > 0)], ['Peso y CBM por bulto', todos(i => N(i.pesoBulto) > 0 && N(i.cbmBulto) > 0)]],
    [['Flete', N(c.flete) > 0], ['Seguro', N(c.seguro) > 0], ['BL / contenedor', !!l.bl], ['Naviera', !!l.naviera], ['ETD', !!l.etd], ['ETA', !!l.eta]],
    [['Tasa de aduana', N(p.tasaAduana) > 0], ['Código arancelario y tarifa', todos(i => i.arancel && i.tarifa !== '' && i.tarifa != null)],
     ['Gastos locales y portuarios', (l.gastosLocales || []).some(g => N(g.bs) > 0)], ['Agente aduanal y transporte', (l.agente || []).some(a => N(a.usd) > 0)], ['Documentos entregados', /entreg/i.test(l.documentos || '')]],
    [['Fecha de llegada al almacén', !!l.llegadaAlmacen]]];
}
const DOCS = ['Pendientes', 'Parciales', 'Entregados'];

/* ===================== MOTOR DE COSTEO =====================
   Replica la hoja "Estimacion Inicial Costeo de Productos":
   todo gasto del lote se reparte entre los productos por su peso en el FOB (factor de distribucion). */
function N(v){ v = parseFloat(v); return isFinite(v) ? v : 0; }
function D(v, d){ v = parseFloat(v); return isFinite(v) ? v : d; }
function sum(a){ return a.reduce((s, x) => s + x, 0); }

// si se cargo el monto REAL de la planilla de aduana, se reparte en proporcion a lo calculado
function ajustarAReal(R, k, real){
  real = N(real); if (real <= 0) return;
  const tot = sum(R.map(r => r[k]));
  R.forEach(r => { r[k] = tot ? r[k] * real / tot : real * r.F; });
}

// CIF del lote: es la base con la que se reparten los gastos de un contenedor compartido
function cifDeLote(l){
  const p = l.params || {}, c = l.costos || {};
  return sum((l.items || []).map(i => N(i.fob) * N(i.cant))) + N(c.flete) + (p.cifSeguro ? N(c.seguro) : 0) + (p.cifGastosOrigen ? N(c.gastosOrigen) : 0);
}
// reparte los gastos compartidos del contenedor entre sus lotes, segun el CIF de cada uno
function repartoGrupo(nombre, lotes, grupos){
  const g = (grupos || {})[nombre], ms = lotes.filter(l => l.grupo === nombre);
  const total = g ? sum((g.compartidos || []).map(x => N(x.usd))) : 0;
  const cifs = ms.map(cifDeLote), cifT = sum(cifs);
  return { total, cifT, filas: ms.map((l, x) => ({ l, cif: cifs[x], pct: cifT ? cifs[x] / cifT : 0, usd: cifT ? total * cifs[x] / cifT : 0 })) };
}

// suma de un conjunto de productos ya calculados (todo el lote, o solo los que deja un filtro)
const CLAVES_TOTAL = ['fob','cif','cifBs','advBs','tasaBs','ivaBs','advUsd','tasaUsd','ivaUsd','ivaCostoUsd','ivaCostoBs','glUsd','glBs','agUsd','agBs',
  'nac','nacPar','nacBs','gadic','landed','landedPar','bultos','peso','cbm','cant','adic','intFin','intFlete','flete','seg','go'];
function totales(R){
  const T = {}; CLAVES_TOTAL.forEach(k => T[k] = sum(R.map(r => r[k])));
  T.vsFob = T.fob ? T.landed / T.fob - 1 : 0;
  return T;
}

function calcLote(l, lotes, grupos){
  lotes = lotes || DB.lotes; grupos = grupos || DB.grupos;
  const p = l.params || {}, c = l.costos || {}, its = l.items || [], gl = l.gastosLocales || [], ag = l.agente || [], re = l.realesBs || {};
  const compUsd = l.grupo ? (repartoGrupo(l.grupo, lotes, grupos).filas.find(f => f.l === l) || { usd: 0 }).usd : 0;
  const fobs = its.map(i => N(i.fob) * N(i.cant)), fobT = sum(fobs);
  const adic = N(c.adicional), flete = N(c.flete), seg = N(c.seguro), go = N(c.gastosOrigen);
  const kInt = D(p.intPct, 12) / 100 / 365 * D(p.intDias, 180);
  const intFinCalc = (adic + fobT) * kInt, intFleteCalc = (flete + seg + go) * kInt;
  const intFin = D(c.intFinFijo, intFinCalc), intFlete = D(c.intFleteFijo, intFleteCalc);   // monto fijo manda sobre el calculado
  const tA = N(p.tasaAduana), tPar = N(p.tasaParalelo), tAg = N(p.tasaAgente) || tA;
  const glBs = sum(gl.map(g => N(g.bs))), glUsd = sum(gl.map(g => N(g.tc) ? N(g.bs) / N(g.tc) : 0));
  const agUsd = sum(ag.map(a => N(a.usd))) + compUsd;
  const pT = D(p.pctTasa, 1) / 100, pI = D(p.pctIva, 16) / 100;
  const kPar = (tPar > 0 && tA > 0) ? tA / tPar : 1;
  const fueraCif = (p.cifSeguro ? 0 : seg) + (p.cifGastosOrigen ? 0 : go);

  const R = its.map((i, x) => {
    const F = fobT ? fobs[x] / fobT : 0;
    const cif = fobs[x] + flete * F + (p.cifSeguro ? seg * F : 0) + (p.cifGastosOrigen ? go * F : 0);
    const cifBs = cif * tA;
    return { F, fob: fobs[x], cif, cifBs, advBs: cifBs * N(i.tarifa) / 100, tasaBs: cifBs * pT };
  });
  ajustarAReal(R, 'advBs', re.adv); ajustarAReal(R, 'tasaBs', re.tasa);
  R.forEach(r => { r.ivaBs = (r.cifBs + r.advBs + r.tasaBs) * pI; });
  ajustarAReal(R, 'ivaBs', re.iva);

  R.forEach((r, x) => {
    const i = its[x], cant = N(i.cant), F = r.F, aUsd = v => tA ? v / tA : 0;
    r.cant = cant;
    r.bultos = N(i.pzasCtn) ? cant / N(i.pzasCtn) : 0;
    r.peso = r.bultos * N(i.pesoBulto); r.cbm = r.bultos * N(i.cbmBulto);
    r.advUsd = aUsd(r.advBs); r.tasaUsd = aUsd(r.tasaBs); r.ivaUsd = aUsd(r.ivaBs);
    r.ivaCostoUsd = i.ivaCosto ? r.ivaUsd : 0; r.ivaCostoBs = i.ivaCosto ? r.ivaBs : 0;
    r.glUsd = glUsd * F; r.glBs = glBs * F; r.agUsd = agUsd * F; r.agBs = r.agUsd * tAg;
    const nacional = r.advUsd + r.tasaUsd + r.glUsd + r.agUsd + r.ivaCostoUsd;   // lo que se paga en Bs
    r.nac = r.cif + nacional; r.nacPar = r.cif + nacional * kPar;
    r.nacBs = r.cifBs + r.advBs + r.tasaBs + r.glBs + r.agBs + r.ivaCostoBs;
    r.adic = adic * F; r.intFin = intFin * F; r.intFlete = intFlete * F; r.flete = flete * F; r.seg = seg * F; r.go = go * F;
    r.gadic = (adic + intFin + intFlete + fueraCif) * F;
    r.landed = r.nac + r.gadic; r.landedPar = r.nacPar + r.gadic;
    const u = v => cant ? v / cant : 0;
    r.fobU = N(i.fob); r.cifU = u(r.cif); r.nacU = u(r.nac); r.gadicU = u(r.gadic);
    r.landedU = u(r.landed); r.landedParU = u(r.landedPar);
    r.vsFob = r.fobU ? r.landedU / r.fobU - 1 : 0;
    r.bsU = r.nacU * tAg;
  });
  const T = totales(R);
  return { R, T, fobT, adic, flete, seg, go, intFin, intFlete, intFinCalc, intFleteCalc, compUsd, glUsd, glBs, agUsd, tA, tPar, tAg, kPar };
}
/* ===================== FIN MOTOR ===================== */

// compara el motor contra lo que dio el Excel original (seed.js trae _xl por producto)
function validarContraExcel(){
  return (window.SEED_LOTES || []).map(l => {
    const { R } = calcLote(l, window.SEED_LOTES, window.SEED_GRUPOS); let dNac = 0, dLan = 0, peor = '';
    l.items.forEach((i, x) => {
      const a = Math.abs(R[x].nacU - i._xl.nac), b = Math.abs(R[x].landedU - i._xl.landed);
      if (b > dLan) { dLan = b; peor = i.ref + ': app ' + R[x].landedU.toFixed(5) + ' / Excel ' + i._xl.landed.toFixed(5); }
      dNac = Math.max(dNac, a);
    });
    return { lote: l.nombre, productos: l.items.length, dNac, dLan, peor };
  });
}

/* ===================== DATOS ===================== */
let DB = { lotes: [], grupos: {} }, TASAS = {};
const FILTRO_LOTE = [['ref', 'REF'], ['desc', 'Descripción'], ['prov', 'Proveedor'], ['oc', 'OC']];   // mismo orden que las columnas de la tabla
let filLote = {};    // filtro de productos dentro del lote abierto: los valores mostrados son la suma de lo filtrado
const pasaFiltroLote = (l, i) => FILTRO_LOTE.every(([k]) => !filLote[k] || sinAcento(k === 'prov' ? provDe(l, i) : k === 'oc' ? ocDe(l, i) : i[k] || '').includes(sinAcento(filLote[k])));
let abiertas = {};   // secciones que el usuario abrio/cerro a mano en el lote actual
let view = 'tablero', curId = null, fil = { q: '', est: '', prov: '' }, origenLote = 'tablero', filProd = '', filCol = {}, ordProd = { k: 'ref', dir: 1 };
let selProd = new Set();   // productos resaltados en la pagina Productos (clave: idLote|posicion)
const $ = s => document.querySelector(s), main = $('#main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const fmt = (n, d = 2) => (isFinite(n) ? n : 0).toLocaleString('es-VE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => fmt(n * 100, 1) + '%';
const fFecha = s => s ? s.split('-').reverse().join('/') : '—';

function loteSemilla(l){
  const c = JSON.parse(JSON.stringify(l));
  c.items.forEach(i => delete i._xl);
  c.estatus = normEstatus(c.estatus);
  c.updatedAt = new Date().toISOString();
  return c;
}
function cargar(){
  try { DB = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { DB = null; }
  const gSemilla = () => JSON.parse(JSON.stringify(window.SEED_GRUPOS || {}));
  if (!DB || !Array.isArray(DB.lotes)) { DB = { lotes: (window.SEED_LOTES || []).map(loteSemilla), grupos: gSemilla() }; guardar(); }
  if (!DB.grupos) {   // datos de la v1 (sin contenedores): se agrupan los lotes que el Excel ya repartia a mano
    DB.grupos = gSemilla();
    (window.SEED_LOTES || []).filter(s => s.grupo).forEach(s => { const l = DB.lotes.find(x => x.id === s.id); if (l) { l.grupo = s.grupo; l.agente = JSON.parse(JSON.stringify(s.agente)); } });
    guardar();
  }
  DB.lotes.forEach(l => { l.estatus = normEstatus(l.estatus); });
  if (!DB.plan || !Array.isArray(DB.plan.lineas)) { DB.plan = planInicial(); guardar(); }
  if (aplicarProformas()) guardar();
  // 23/10/2026: los lotes que vinieron del Excel ya llegaron todos -> "En almacen" (una sola vez; la fecha es la de aduana si la hay)
  DB.migraciones = DB.migraciones || [];
  if (!DB.migraciones.includes('lotes-excel-en-almacen')) {
    DB.lotes.filter(l => /^xl-/.test(l.id) && l.estatus !== ETAPAS[4]).forEach(l => {
      l.estatus = ETAPAS[4]; (l.historial = l.historial || []).push({ estatus: l.estatus, fecha: l.llegadaAlmacen || l.params.fechaAduana || hoy() }); l.updatedAt = new Date().toISOString(); });
    DB.migraciones.push('lotes-excel-en-almacen'); guardar();
  }
  // 23/10/2026: la orden Leaderart 2026 nunca se compro -> se borra; el ultimo lote real de Leaderart es el de 2025 (BL KULS005583)
  if (!DB.migraciones.includes('leaderart-2025b')) {
    DB.lotes = DB.lotes.filter(l => l.id !== 'xl-leaderart');
    const s = (window.SEED_LOTES || []).find(l => l.id === 'xl-leaderart-2025-kuls005583');
    if (s) {   /* si el navegador trajo un seed.js viejo, se reintenta la proxima vez */
      if (!DB.lotes.some(l => l.id === s.id)) DB.lotes.push(loteSemilla(s));
      DB.migraciones.push('leaderart-2025b');
    }
    ordenarGrupos(); guardar();
  }
  // datos anteriores a la v4: los lotes del Excel con dos proveedores traian el nombre unido ("Civors + OFICINA")
  (window.SEED_LOTES || []).filter(s => s.items.some(i => i.prov)).forEach(s => {
    const l = DB.lotes.find(x => x.id === s.id); if (!l || l.items.some(i => i.prov)) return;
    l.items.forEach(i => { const o = s.items.find(x => x.ref === i.ref); if (o) { i.prov = o.prov; i.oc = o.oc; } });
    if (/ \+ /.test(l.proveedor || '')) l.proveedor = '';
  });
}
// un contenedor existe mientras tenga lotes; al nombrarlo por primera vez se crea vacio
function ordenarGrupos(){
  const usados = new Set(DB.lotes.map(l => l.grupo).filter(Boolean));
  Object.keys(DB.grupos).forEach(k => { if (!usados.has(k)) delete DB.grupos[k]; });
  usados.forEach(k => { if (!DB.grupos[k]) DB.grupos[k] = { compartidos: [] }; });
}
let tGuardar = null;
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast('No se pudo guardar en este navegador'); } }
function guardarLuego(){ clearTimeout(tGuardar); tGuardar = setTimeout(guardar, 400); }
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
const lote = () => DB.lotes.find(l => l.id === curId);
// un lote puede traer cargas de varios proveedores: el producto manda, y si no dice nada vale el del lote
const provDe = (l, i) => i.prov || l.proveedor || '';
const ocDe = (l, i) => i.oc || l.oc || '';
const provsDe = l => [...new Set((l.items || []).map(i => provDe(l, i)).filter(Boolean))];
const todosProvs = () => [...new Set(DB.lotes.flatMap(provsDe))].sort((a, b) => a.localeCompare(b));

  return { id: 'l' + Date.now(), nombre: 'Nuevo lote', grupo: '', oc: '', proveedor: '', puerto: '', agenteCarga: '', bl: '', naviera: '', agenteAduanal: '',
    estatus: ETAPAS[0], etd: '', eta: '', documentos: 'Pendientes', llegadaAlmacen: '', notas: '',
    params: { fechaAduana: '', tasaAduana: '', tasaParalelo: '', pctTasa: 1, pctIva: 16, intPct: 12, intDias: 180, cifSeguro: true, cifGastosOrigen: false, tasaAgente: '' },
    costos: { adicional: '', flete: '', seguro: '', gastosOrigen: '', intFinFijo: '', intFleteFijo: '' }, realesBs: {}, gastosLocales: [], agente: [{ concepto: 'Agente aduanal', usd: '' }, { concepto: 'Transporte / flete local', usd: '' }],
    items: [itemVacio()], updatedAt: new Date().toISOString() };
}
const itemVacio = () => ({ prov: '', oc: '', ref: '', desc: '', unidad: 'UND', cant: '', inner: '', pzasCtn: '', pesoBulto: '', cbmBulto: '', fob: '', arancel: '', exoneracion: 'Paga full', tarifa: '', ivaCosto: false });

function chip(e){
  const k = ['plan', 'prod', 'tran', 'puer', 'alma'][ETAPAS.indexOf(e)] || '';
  return `<span class="chip ${k}">${esc(e || '—')}</span>`;
}
function ir(v, id){
  // al abrir un lote desde la lista filtrada por proveedor, el lote abre con ese mismo filtro
  filLote = (v === 'lote' && view === 'tablero' && fil.prov) ? { prov: fil.prov } : {};
  view = v; curId = id || null; abiertas = {}; if (v !== 'lote') origenLote = 'tablero'; render(); window.scrollTo(0, 0); }

/* ===================== VISTAS ===================== */
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view || (view === 'lote' && b.dataset.v === 'tablero')));
  ({ tablero: vTablero, plan: vPlan, analisis: vAnalisis, lote: vLote, productos: vProductos, proveedores: vProveedores, respaldo: vRespaldo }[view])();
}

const inp = (p, v, t = 'text', extra = '') => `<input data-p="${p}" type="${t}" value="${esc(v == null ? '' : v)}" ${t === 'number' ? 'step="any"' : ''} ${extra}>`;

const check = (lab, p, v) => `<div class="f chk"><input type="checkbox" id="k_${p}" data-p="${p}" ${v ? 'checked' : ''}><label for="k_${p}">${lab}</label></div>`;

// seccion plegable: abierta si el lote ya llego a la etapa en que se llena (o si el usuario la abrio)
function sec(id, minEt, et, titulo, sub, cuerpo, estilo){
  const abierta = id in abiertas ? abiertas[id] : et >= minEt;
  return `<details class="card" data-sec="${id}" ${abierta ? 'open' : ''} ${estilo || ''}><summary><h3>${titulo} <span class="sub">${sub}</span>${et < minEt ? `<span class="r chip">Se completa en: ${ETAPAS[minEt]}</span>` : ''}</h3></summary>${cuerpo}</details>`;
}

function cambiarEtapa(i){
  const l = lote(); if (i === etapa(l)) return;
  l.estatus = ETAPAS[i]; (l.historial = l.historial || []).push({ estatus: l.estatus, fecha: hoy() });
  abiertas = {}; tocar(l); vLote(); window.scrollTo(0, 0); toast('Estatus: ' + l.estatus);
}
main.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.sec) abiertas[e.target.dataset.sec] = e.target.open; }, true);
function tocar(l){ l.updatedAt = new Date().toISOString(); guardarLuego(); }
function setPath(o, path, val){ const k = path.split('.'); for (let i = 0; i < k.length - 1; i++) o = o[k[i]] || (o[k[i]] = {}); o[k[k.length - 1]] = val; }

main.addEventListener('input', e => {
  const el = e.target; if (view !== 'lote') return;
  const l = lote();
  if (el.dataset.gp) {   // gasto compartido del contenedor
    const [idx, k] = el.dataset.gp.split('.');
    DB.grupos[l.grupo].compartidos[+idx][k] = el.type === 'number' ? (el.value === '' ? '' : parseFloat(el.value)) : el.value;
    tocar(l); recalc(); return;
  }
  if (el.dataset.fl) { filLote[el.dataset.fl] = el.value.trim(); el.classList.toggle('act', !!el.value.trim()); recalc(); return; }
  if (!el.dataset.p || el.dataset.p === 'grupo') return;   // el contenedor se aplica al terminar de escribir (change)
  setPath(l, el.dataset.p, el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? '' : parseFloat(el.value)) : el.value);
  tocar(l); recalc();
});
// al poner una fecha, si la tasa esta vacia se trae la del BCV de ese dia
main.addEventListener('change', e => {
  const el = e.target; if (view !== 'lote') return;
  if (el.dataset.p === 'grupo') {
    const l = lote(), nuevo = el.value.trim(); if (nuevo === (l.grupo || '')) return;
    l.grupo = nuevo; ordenarGrupos(); tocar(l); vLote();
    if (nuevo) toast(DB.lotes.filter(x => x.grupo === nuevo).length > 1 ? 'Lote agregado al contenedor' : 'Contenedor creado: asigne el mismo nombre a los otros lotes');
    return;
  }
  if (!el.dataset.tasa || !el.value) return;
  const t = TASAS[el.value], dest = main.querySelector(`[data-p="${el.dataset.tasa}"]`);
  if (t && dest && dest.value === '') { dest.value = t[0]; dest.dispatchEvent(new Event('input', { bubbles: true })); toast('Tasa BCV del ' + fFecha(el.value) + ': ' + fmt(t[0], 4)); }
});
main.addEventListener('click', e => {
  const g = e.target.closest('[data-gdel]');
  if (g && view === 'lote') { const l = lote(); DB.grupos[l.grupo].compartidos.splice(+g.dataset.gdel, 1); tocar(l); vLote(); return; }
  const b = e.target.closest('[data-del]'); if (!b || view !== 'lote') return;
  const [arr, idx] = b.dataset.del.split('.'), l = lote();
  if (arr === 'items' && l.items.length === 1) return toast('El lote necesita al menos un producto');
  l[arr].splice(+idx, 1); tocar(l); vLote();
});

function exportarCsv(l){
  const c = calcLote(l), n = v => String(Math.round(v * 1e6) / 1e6).replace('.', ',');
  const head = ['OC', 'Proveedor', 'REF', 'Descripcion', 'Unidad', 'Cant', 'FOB unit $', 'FOB total $', 'CIF total $', 'Ad-valorem $', 'Tasa $', 'IVA $', 'IVA al costo', 'Gastos locales $',
    'Agente+transporte $', 'Nacionalizado unit $', 'Gastos adicionales unit $', 'Landed unit $', 'Landed paralelo unit $', 'Landed vs FOB %', 'Costo Bs unit', 'Landed total $'];
  const rows = c.R.map((r, x) => { const i = l.items[x]; return [ocDe(l, i), provDe(l, i), i.ref, i.desc, i.unidad, n(r.cant), n(r.fobU), n(r.fob), n(r.cif), n(r.advUsd), n(r.tasaUsd), n(r.ivaUsd), i.ivaCosto ? 'SI' : 'NO',
    n(r.glUsd), n(r.agUsd), n(r.nacU), n(r.gadicU), n(r.landedU), n(r.landedParU), n(r.vsFob * 100), n(r.bsU), n(r.landed)]; });
  const csv = '﻿' + [head, ...rows].map(f => f.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  descargar('Costeo ' + l.nombre.replace(/[\\/:*?"<>|]/g, '') + '.csv', csv, 'text/csv');
}
function descargar(nombre, contenido, tipo){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo })); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ===================== PLANIFICACION =====================
   Plan de compra por referencia, como la hoja "COMPRA OCT 2026":
   compra = venta estimada - inventario + venta pendiente;  costo total = compra x costo FOB.
   Cada linea trae ademas los datos del ULTIMO lote donde vino esa referencia (FOB, empaque, landed). */
const PB = () => window.PLAN_BASE || { productos: [], extras: [] };
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
let filPlan = {}, ordPlan = { k: 'prov', dir: 1 }, grupoPlan = 'prov', visPlan = [];
let _pbMap = null;
const claveRef = r => String(r || '').trim().toLowerCase();
const pbMap = () => _pbMap || (_pbMap = Object.fromEntries(PB().productos.map(p => [claveRef(p.ref), p])));
const idLinea = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ultimo lote real (no los que siguen en planificacion) donde vino cada referencia
function historialRefs(){
  const m = {};
  DB.lotes.filter(l => etapa(l) > 0).forEach(l => { const c = calcLote(l); l.items.forEach((i, x) => {
    const k = claveRef(i.ref); if (!k) return;
    const cand = { l, i, r: c.R[x], orden: (l.params.fechaAduana || '') + '|' + (l.oc || '') };
    if (!m[k] || cand.orden > m[k].orden) m[k] = cand; }); });
  return m;
}
function lineaNueva(ref, H){
  const k = claveRef(ref), b = pbMap()[k], h = H[k];
  return { id: idLinea(), ref: b ? b.ref : h ? h.i.ref : String(ref).trim(), prov: b ? b.prov : h ? provDe(h.l, h.i) : '', desc: b ? b.desc : h ? h.i.desc : '',
    inv: b ? b.inv : '', pend: b ? b.pend : '', est: b ? b.est : '', compraFija: '', fob: b && b.fob ? b.fob : h ? h.r.fobU : '' };
}
// plan inicial = lo que el Excel ya tenia con compra (mas sus partidas globales, ej. "Nuevos proyectos")
function planInicial(){
  const H = historialRefs(), b = PB();
  return { nombre: (b.origen || 'Plan de compra').split(' / ').pop(), lineas: b.productos.filter(p => p.compraXl > 0).map(p => lineaNueva(p.ref, H))
    .concat((b.extras || []).map(e => ({ id: idLinea(), ref: '', prov: e.prov, desc: e.desc, inv: '', pend: '', est: '', compraFija: 1, fob: e.monto }))) };
}
// Proformas (proformas.js): cada una entra UNA vez al plan como lineas con su cantidad y precio, y queda como documento anexo.
// Si la referencia ya estaba en el plan, se completa esa linea en vez de duplicarla.
function aplicarProformas(){
  const P = window.PROFORMAS || [], pl = DB.plan; pl.proformas = pl.proformas || []; pl.docs = pl.docs || []; let n = 0;
  P.forEach(pf => {
    if (pl.proformas.includes(pf.id)) {   /* ya aplicada: solo se completan codigos OFICA que se hayan indicado despues */
      pf.items.forEach(it => { const ln = it.ref && pl.lineas.find(l => l.proforma === pf.id && l.codProv === it.cod && (!l.ref || (l.ref === l.codProv && it.ref !== l.ref)));   /* vacio, o codigo temporal = el del proveedor */
        if (ln) { const b = pbMap()[claveRef(it.ref)]; ln.ref = it.ref; if (b) { ln.inv = b.inv; ln.pend = b.pend; ln.est = b.est; } n++; } });
      return;
    }
    pf.items.forEach(it => {
      let ln = it.ref && pl.lineas.find(l => claveRef(l.ref) === claveRef(it.ref) && !l.proforma);
      if (!ln) { const b = pbMap()[claveRef(it.ref)]; ln = { id: idLinea(), ref: it.ref || '', prov: pf.proveedor, desc: it.desc, inv: b ? b.inv : '', pend: b ? b.pend : '', est: b ? b.est : '' }; pl.lineas.push(ln); }
      Object.assign(ln, { compraFija: it.cant, fob: it.precio, proforma: pf.id, codProv: it.cod, unidad: it.unidad, cajas: it.cajas, arancel: it.arancel || '' });
    });
    pl.proformas.push(pf.id);
    pl.docs.push({ id: pf.id, titulo: 'Proforma ' + pf.proveedor + ' ' + pf.id, fecha: pf.fecha, total: pf.total, lineas: pf.items.length, pdf: pf.pdf, xlsx: pf.xlsx,
      detalle: [pf.razonSocial, pf.incoterm, pf.condicion, 'despacho ' + pf.despacho].filter(Boolean).join(' · ') });
    n++;
  });
  return n;
}
function calcLinea(ln, H){
  const k = claveRef(ln.ref), b = pbMap()[k], h = H[k], m2 = PB().mesesAnio2 || 10;
  const sug = Math.max(0, N(ln.est) - N(ln.inv) + N(ln.pend));
  const compra = (ln.compraFija === '' || ln.compraFija == null) ? sug : N(ln.compraFija), total = compra * N(ln.fob);
  const pz = h ? N(h.i.pzasCtn) : 0, bultos = pz ? compra / pz : 0, cbm = bultos * (h ? N(h.i.cbmBulto) : 0);
  const v1 = b ? sum(b.v1) : 0, v2 = b ? sum(b.v2) : 0;
  return { sug, compra, total, bultos, cbm, landed: h && h.r.fobU ? total * h.r.landedU / h.r.fobU : 0, v1, v2, prom: b ? (sum(b.v1.slice(m2)) + v2) / 12 : 0,
    b, h, lote: h ? h.l.nombre : '', fobHist: h ? h.r.fobU : 0, enLote: !!ln.loteId && DB.lotes.some(l => l.id === ln.loteId) };
}
const familia = ref => ((String(ref || '').match(/^[A-Za-z]+/) || [''])[0].toUpperCase()) || '(sin referencia)';
const GRUPOS_PLAN = { prov: 'Proveedor', prof: 'Proforma', fam: 'Familia (letras de la REF)', lote: 'Último lote', ref: 'Producto' };

      inv: N(ln.inv), pend: N(ln.pend), est: N(ln.est), fob: N(ln.fob), v1: c.v1, v2: c.v2, prom: c.prom, compra: c.compra, total: c.total, fobHist: c.fobHist, bultos: c.bultos, cbm: c.cbm, landed: c.landed }; });
}

  const g = {}; vis.forEach(f => { const k = f[grupoPlan] || (grupoPlan === 'lote' ? '(sin lote anterior)' : '(sin dato)'), o = (g[k] = g[k] || { n: 0, u: 0, t: 0, cbm: 0, lan: 0 });
    o.n++; o.u += f.cod ? f.compra : 0; o.t += f.total; o.cbm += f.cbm; o.lan += f.landed; });

    <tr class="tot"><td>Total</td><td class="n">${vis.length}</td><td class="n">${fmt(sum(ks.map(k => g[k].u)), 0)}</td><td class="n">${fmt(tot)}</td><td class="n">${tot ? '100,0%' : ''}</td><td class="n">${fmt(T('cbm'), 1)}</td><td class="n">${fmt(T('landed'))}</td></tr>

// un lote "En planificacion" por proveedor, con las lineas filtradas que tienen compra; cada producto hereda empaque y arancel de su ultimo lote
function crearLotesDelPlan(){

  const porProv = {}; cand.forEach(f => (porProv[f.prov || '(sin proveedor)'] = porProv[f.prov || '(sin proveedor)'] || []).push(f));
  const provs = Object.keys(porProv);
  if (!confirm('Se crearán ' + provs.length + ' lotes en estatus "En planificación", uno por proveedor:\n\n' + provs.map(p => '• ' + p + ': ' + porProv[p].length + ' productos, $' + fmt(sum(porProv[p].map(f => f.total)))).join('\n') + '\n\n¿Continuar?')) return;
  provs.forEach((p, n) => {
    const fs = porProv[p], l = nuevoLote(), h0 = (fs.find(f => f.c.h) || { c: {} }).c.h;
    l.id = 'l' + Date.now() + n; l.nombre = (DB.plan.nombre || 'Plan') + ' — ' + p; l.proveedor = p === '(sin proveedor)' ? '' : p;

    if (h0) { l.puerto = / \+ /.test(h0.l.puerto || '') ? '' : h0.l.puerto || ''; /* si el ultimo lote mezclaba dos cargas, el puerto no se hereda */ l.agenteAduanal = h0.l.agenteAduanal || ''; l.params.cifSeguro = !!h0.l.params.cifSeguro; l.params.cifGastosOrigen = !!h0.l.params.cifGastosOrigen; }
    l.notas = 'Creado desde Planificación (' + (DB.plan.nombre || '') + ') el ' + fFecha(hoy()) + '.';
    l.items = fs.map(f => { const i = f.c.h ? f.c.h.i : {};
      return Object.assign(itemVacio(), { ref: f.cod, desc: f.desc, cant: f.compra, fob: f.fob === 0 ? '' : f.fob, unidad: i.unidad || f.ln.unidad || 'UND', inner: i.inner || '', pzasCtn: i.pzasCtn || (f.ln.cajas ? Math.round(f.compra / f.ln.cajas * 100) / 100 : ''),
        pesoBulto: i.pesoBulto || '', cbmBulto: i.cbmBulto || '', arancel: i.arancel || f.ln.arancel || '', exoneracion: i.exoneracion || 'Paga full', tarifa: i.tarifa == null ? '' : i.tarifa, ivaCosto: !!i.ivaCosto }); });
    DB.lotes.push(l); fs.forEach(f => { f.ln.loteId = l.id; });
  });
  guardar(); fil = { q: '', est: ETAPAS[0], prov: '' }; ir('tablero'); toast(provs.length + ' lotes creados en planificación');
}

/* ===================== ANALISIS =====================
   Por producto y proveedor: que se compro en cada lote, cuanto se vendio cada mes y como fue quedando el inventario.
   Ventas: historico de Pedidos OFICA (analisis_base.js + el publicado en GitHub, que se baja al abrir la pagina);
   desde 2025 manda el Excel de planificacion (plan_base.js), que llega al mes mas reciente.
   Inventario final de cada mes: se reconstruye hacia atras desde el inventario actual (inv. del mes anterior = inv. - compras + ventas). */
const AB = () => window.ANALISIS_BASE || { catalogo: {}, ventas: {} };
const URL_VENTAS = 'https://boadar.github.io/practica-git/pedidos/historico_ventas.json';

  { k: 'cant', t: 'Cant.', d: 0 }, { k: 'fobU', t: 'FOB unit $', d: 4 }, { k: 'fob', t: 'FOB total $', d: 2 }, { k: 'inner', t: 'Inner', d: 0 },
  { k: 'pzas', t: 'Pzas/CTN', d: 0 }, { k: 'cbmB', t: 'CBM/bulto', d: 4 }, { k: 'landedU', t: 'Landed unit $', d: 4, hi: 1 }, { k: 'landed', t: 'Landed total $', d: 2 }];
const FILTROS_AN = ['ref', 'desc', 'prov', 'cat', 'lote', 'est'];
const pad2 = n => String(n).padStart(2, '0');
const nomMes = ym => MESES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(2, 4);
const MESES_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const nomMesEn = ym => MESES_EN[+ym.slice(5, 7) - 1] + '<br>' + ym.slice(2, 4);   /* encabezados de la tabla de ventas (en ingles, en dos lineas) */
function mesesEntre(a, b){ const r = []; let y = +a.slice(0, 4), m = +a.slice(5, 7); while (y * 12 + m <= +b.slice(0, 4) * 12 + +b.slice(5, 7)) { r.push(y + '-' + pad2(m)); if (++m > 12) { m = 1; y++; } } return r; }
// categoria: la que el usuario fijo en esta app (DB.categorias) manda sobre la del catalogo
const catCatalogo = ref => { const c = AB().catalogo[String(ref || '').toUpperCase()]; return (c && c.cat) || familia(ref); };
const catDe = ref => ((DB.categorias || {})[String(ref || '').toUpperCase()]) || catCatalogo(ref);

    const v = {}; Object.values(h).forEach(prods => Object.entries(prods).forEach(([p, ms]) => { const o = v[p.toUpperCase()] = v[p.toUpperCase()] || {}; Object.entries(ms).forEach(([ym, n]) => { o[ym] = (o[ym] || 0) + n; }); }));

}
// venta mensual de una referencia: historico (guardado + publicado) y, para los meses que cubre, el Excel de planificacion

  return m;
}
function invActual(ref){ const b = pbMap()[claveRef(ref)]; if (b) return N(b.inv); const c = AB().catalogo[String(ref || '').toUpperCase()]; return c && c.invCat != null ? N(c.invCat) : 0; }

function filasAnalisis(){

  PB().productos.filter(p => N(p.compraXl) > 0 && !yaEstan.has(claveRef(p.ref))).forEach(p => {
    r.push({ key: '', id: '', ref: p.ref, desc: p.desc, prov: p.prov, cat: catDe(p.ref), lote: '(sin lote)', est: '', fecha: '', recibido: false,
      cant: 0, fobU: N(p.fob), fob: 0, inner: 0, pzas: 0, cbmB: 0, landedU: 0, landed: 0 }); });
  return r;
}
// compras recibidas, ventas e inventario final por mes de un conjunto de referencias
function evolucion(refs, filas, meses){
  const V = {}, C = {}, L = {};
  refs.forEach(r => { const vm = ventasMes(r); meses.forEach(m => { V[m] = (V[m] || 0) + N(vm[m]); }); });
  const claves = new Set(refs.map(claveRef));
  filas.filter(f => f.recibido && f.fecha && claves.has(claveRef(f.ref))).forEach(f => { const m = f.fecha.slice(0, 7); C[m] = (C[m] || 0) + f.cant; (L[m] = L[m] || new Set()).add(f.lote); });
  let inv = sum(refs.map(invActual)); const I = {};
  for (let i = meses.length - 1; i >= 0; i--) { const m = meses[i]; I[m] = inv; inv = inv - N(C[m]) + N(V[m]); }
  return { V, C, I, L };
}

function vAnalisis(foco){
  if (ventasVivas === null) { ventasVivas = false; cargarVentasVivas(); }
  const filas = filasAnalisis(), txt = (x, y) => String(x).localeCompare(String(y), 'es', { numeric: true });
  const pasa = (f, salvo) => FILTROS_AN.every(k => k === salvo || !filAn[k] || sinAcento(f[k]).includes(sinAcento(filAn[k])));
  const col = COLS_AN.find(c => c.k === ordAn.k) || COLS_AN[0];
  const vis = filas.filter(f => pasa(f)).sort((a, b) => ordAn.dir * (col.txt ? txt(a[col.k], b[col.k]) : a[col.k] - b[col.k]) || txt(a.ref, b.ref) || txt(b.fecha, a.fecha));
  const opciones = k => [...new Set(filas.filter(f => pasa(f, k)).map(f => f[k]))].filter(Boolean).sort(txt);
  const refs = [...new Map(vis.filter(f => f.ref).map(f => [claveRef(f.ref), f])).values()].sort((a, b) => txt(a.ref, b.ref));
  // meses: desde el primer dato de venta o compra hasta el ultimo mes con ventas
  const fin = mesFinal(), primeros = [AB().desde || fin]; filas.forEach(f => { if (f.recibido && f.fecha) primeros.push(f.fecha.slice(0, 7)); });
  const rango = mesesEntre(primeros.sort()[0] > fin ? fin : primeros.sort()[0], fin);
  const anios = [...new Set(rango.map(m => m.slice(0, 4)))].reverse();
  const per = periodoAn === 'todo' ? rango : /^\d{4}$/.test(periodoAn) ? rango.filter(m => m.startsWith(periodoAn)) : rango.slice(-(+periodoAn));
  const perSet = new Set(per), cache = new Map(), vm = r => cache.get(r) || (cache.set(r, ventasMes(r)), cache.get(r));
  // LAST ORDER: cantidad de la referencia en el ultimo lote real registrado (el de fecha de llegada mas reciente; no cuenta lotes en planificacion)
  const ultimo = {};
  filas.filter(g => g.id && g.est !== ETAPAS[0]).forEach(g => { const k = claveRef(g.ref), o = ultimo[k], orden = (g.fecha || '') + '|' + g.lote;
    if (!o || orden > o.orden) ultimo[k] = { orden, lote: g.lote, fecha: g.fecha, cant: g.cant }; else if (orden === o.orden) o.cant += g.cant; });
  const filaB = refs.map(f => { const v = vm(f.ref), meses = per.map(m => N(v[m])), tot = sum(meses), inv = invActual(f.ref);
    const comp = sum(filas.filter(g => g.recibido && claveRef(g.ref) === claveRef(f.ref) && perSet.has((g.fecha || '').slice(0, 7))).map(g => g.cant));
    /* inventario al cierre del periodo: se reconstruye desde el inventario actual (+ ventas posteriores - compras posteriores) */
    const cierre = evolucion([f.ref], filas, rango).I[per[per.length - 1]];
    const prom = per.length ? tot / per.length : 0;
    return { f, meses, tot, prom, comp, cierre, ini: cierre + tot - comp, inv, mi: prom ? inv / prom : Infinity,
      nueva: N((pbMap()[claveRef(f.ref)] || {}).compraXl), ultima: (ultimo[claveRef(f.ref)] || {}).cant || 0, ultimaLote: ultimo[claveRef(f.ref)] || null };   /* NEW ORDER = columna AC (COMPRA) de la hoja del Excel de estimacion */ });
  // orden de la tabla de ventas: tocar un titulo ordena creciente, tocarlo otra vez decreciente
  const valB = (r, k) => k === 'ref' ? r.f.ref : k === 'desc' ? r.f.desc : /^m\d+$/.test(k) ? r.meses[+k.slice(1)] : r[k];
  if (/^m\d+$/.test(ordB.k) && +ordB.k.slice(1) >= per.length) ordB = { k: 'tot', dir: -1 };
  if (ordB.k === 'comp' && !filaB.some(r => r.comp)) ordB = { k: 'tot', dir: -1 };
  filaB.sort((a, b) => { const x = valB(a, ordB.k), y = valB(b, ordB.k);
    return ordB.dir * (typeof x === 'string' ? txt(x, y) : (x === y ? 0 : x > y ? 1 : -1)) || txt(a.f.ref, b.f.ref); });
  const verComp = filaB.some(r => r.comp);   /* si nada se compro en el periodo, la columna Comprado se oculta */
  // fila de totales: si hay lineas resaltadas, es el SUBTOTAL de lo resaltado; si no, el total de todo lo filtrado
  const totalB = () => {
    const sel = filaB.filter(r => selAn.has(claveRef(r.f.ref))), rs = sel.length ? sel : filaB, S = k => sum(rs.map(r => r[k])), tv = S('tot'), ti = S('inv');
    return `<tr class="tot" id="totB"><td colspan="2">${sel.length ? 'SUBTOTAL (' + sel.length + ' selected)' : 'TOTAL'}</td>${per.map((m, i) => `<td class="n">${fmt(sum(rs.map(r => r.meses[i])), 0)}</td>`).join('')}
      <td class="n">${fmt(tv, 0)}</td><td class="n">${fmt(per.length ? tv / per.length : 0, 0)}</td><td class="n">${fmt(S('ini'), 0)}</td>${verComp ? `<td class="n">${fmt(S('comp'), 0)}</td>` : ''}<td class="n">${fmt(S('cierre'), 0)}</td>
      <td class="n">${fmt(ti, 0)}</td><td class="n">${tv ? fmt(ti / (tv / per.length), 1) : '—'}</td><td class="n">${fmt(S('ultima'), 0)}</td><td class="n">${fmt(S('nueva'), 0)}</td></tr>`;
  };
  const thB = (k, t, num, tip) => `<th class="ord ${num ? 'n' : ''}" data-ordb="${k}" ${tip ? `title="${tip}"` : ''}>${t}${ordB.k === k ? (ordB.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  ctxAn = { filas, refs, rango, per, totalB };
  const nFil = FILTROS_AN.filter(k => filAn[k]).length;
  const th = c => `<th class="ord ${c.txt ? '' : 'n'}" data-orda="${c.k}">${c.t}${ordAn.k === c.k ? (ordAn.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const fl = k => `<th><input type="search" data-fan="${k}" list="dla-${k}" class="${filAn[k] ? 'act' : ''}" value="${esc(filAn[k] || '')}" placeholder="(Todos)" title="Escriba parte del texto o elija de la lista">
      <datalist id="dla-${k}">${opciones(k).map(v => `<option value="${esc(v)}">`).join('')}</datalist></th>`;
  const propia = r => !!(DB.categorias || {})[String(r || '').toUpperCase()];
  const celda = (c, f) => c.k === 'cat' && f.ref ? `<td><input data-cat="${esc(f.ref)}" list="dlCats" class="${propia(f.ref) ? 'act' : ''}" value="${esc(f.cat)}" style="min-width:190px"
      title="${propia(f.ref) ? 'Categoría puesta en esta app (catálogo: ' + esc(catCatalogo(f.ref)) + '). Bórrela para volver a la del catálogo.' : 'Categoría del catálogo. Escriba otra para cambiarla en esta app.'}"></td>`
    : c.k === 'est' ? `<td>${chip(f.est)}</td>` : c.k === 'fecha' ? `<td>${f.fecha ? fFecha(f.fecha) : '<span class="mut">—</span>'}</td>`
    : c.txt ? `<td>${c.k === 'ref' ? '<b>' + esc(f.ref) + '</b>' : esc(f[c.k])}</td>` : `<td class="n ${c.hi ? 'hi' : ''}">${f[c.k] ? fmt(f[c.k], c.d) : '<span class="mut">—</span>'}</td>`;
  const T = k => sum(vis.map(f => f[k])), totVen = sum(filaB.map(r => r.tot)), totInv = sum(filaB.map(r => r.inv));
  main.innerHTML = `
  <div class="kpis">
    <div class="kpi"><span>Referencias</span><b>${refs.length}</b></div>
    <div class="kpi"><span>Lotes</span><b>${new Set(vis.map(f => f.id).filter(Boolean)).size}</b></div>
    <div class="kpi"><span>Unidades compradas</span><b>${fmt(T('cant'), 0)}</b></div>
    <div class="kpi"><span>FOB total $</span><b>${fmt(T('fob'))}</b></div>
    <div class="kpi hi"><span>Landed total $</span><b>${fmt(T('landed'))}</b></div>
    <div class="kpi"><span>Vendido en el período</span><b>${fmt(totVen, 0)}</b></div>
    <div class="kpi" title="Inventario según el Excel de planificación (o el catálogo de pedidos si no está ahí)"><span>Inventario actual</span><b>${fmt(totInv, 0)}</b></div>
  </div>
  <div class="card"><h3>Compras por lote <span class="sub">cada fila es un producto en un lote · un clic resalta el producto · doble clic abre el lote</span>
      ${nFil ? `<span class="r"><button class="btn s" id="anClr">Quitar filtros (${nFil})</button></span>` : ''}</h3>
    <div class="tw"><table>
      <tr>${COLS_AN.map(th).join('')}</tr>
      <tr class="filtros">${COLS_AN.map(c => FILTROS_AN.includes(c.k) ? fl(c.k) : '<th></th>').join('')}</tr>
      ${vis.map(f => `<tr class="clk pk ${selAn.has(claveRef(f.ref)) ? 'sel' : ''}" data-ref="${esc(claveRef(f.ref))}" data-key="${esc(f.key)}">${COLS_AN.map(c => celda(c, f)).join('')}</tr>`).join('')
        || `<tr><td colspan="${COLS_AN.length}" class="mut">Ningún producto cumple esos filtros.</td></tr>`}
      ${vis.length ? `<tr class="tot"><td colspan="7">Total (${vis.length} filas)</td><td class="n">${fmt(T('cant'), 0)}</td><td></td><td class="n">${fmt(T('fob'))}</td><td colspan="4"></td><td class="n">${fmt(T('landed'))}</td></tr>` : ''}
    </table></div>
    <datalist id="dlCats">${[...new Set(Object.values(AB().catalogo).map(c => c.cat).concat(Object.values(DB.categorias || {})).filter(Boolean))].sort(txt).map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <p class="note">La categoría se puede cambiar escribiendo en su casilla (vale para todos los lotes de esa referencia). Las cambiadas en esta app se ven en azul; si la borra, vuelve la del catálogo.</p></div>

  <div class="card"><h3>Sales by product by month <span class="sub">units sold · adds up the references filtered above</span>
      <span class="r" style="display:flex;gap:8px;align-items:center"><button class="btn" id="anQuitaSelB" style="${selAn.size ? '' : 'display:none'}">Clear selection</button><select id="anPer" style="width:auto">${[['12', 'Last 12 months'], ['24', 'Last 24 months'], ...anios.map(a => [a, 'Year ' + a]), ['todo', 'All (since ' + nomMesEn(rango[0]).replace('<br>', ' ') + ')']]
        .map(([v, t]) => `<option value="${v}" ${v === periodoAn ? 'selected' : ''}>${t}</option>`).join('')}</select></span></h3>
    <div class="tw alto10"><table class="fija2">
      <tr>${thB('ref', 'REF')}${thB('desc', 'DESCRIPTION')}${per.map((m, i) => thB('m' + i, nomMesEn(m), 1)).join('')}
        ${thB('tot', 'TOTAL<br>SALES', 1, 'Total vendido en el período')}${thB('prom', 'PROM.<br>MONTH', 1, 'Promedio mensual de venta')}${thB('ini', 'INITIAL<br>INV.', 1, 'Inventario al empezar el período = inventario cierre + vendido − comprado')}${verComp ? thB('comp', 'PURCHASED', 1, 'Unidades de lotes ya en almacén que llegaron en el período') : ''}
        ${thB('cierre', 'FINAL<br>INV.', 1, 'Inventario al final del período elegido = inventario actual + ventas posteriores − compras posteriores')}${thB('inv', 'CURRENT<br>INV.', 1, 'Inventario actual')}${thB('mi', 'INV. IN<br>MONTHS', 1, 'Inventario actual ÷ promedio mensual de venta')}${thB('ultima', 'LAST<br>ORDER', 1, 'Cantidad pedida en el último lote registrado de esa referencia')}${thB('nueva', 'NEW<br>ORDER', 1, 'Nueva compra: columna AC (COMPRA) de la hoja ' + esc((PB().origen || '').split(' / ').pop()) + ' del Excel de estimación')}</tr>
      ${filaB.map(r => `<tr class="clk pk ${selAn.has(claveRef(r.f.ref)) ? 'sel' : ''}" data-ref="${esc(claveRef(r.f.ref))}"><td><b>${esc(r.f.ref)}</b></td><td>${esc(r.f.desc)}</td>
        ${r.meses.map(v => `<td class="n">${v ? fmt(v, 0) : '<span class="mut">·</span>'}</td>`).join('')}
        <td class="n hi">${fmt(r.tot, 0)}</td><td class="n">${fmt(r.prom, 0)}</td><td class="n ${r.ini < 0 ? 'pos' : ''}">${fmt(r.ini, 0)}</td>${verComp ? `<td class="n">${r.comp ? fmt(r.comp, 0) : '—'}</td>` : ''}<td class="n ${r.cierre < 0 ? 'pos' : ''}">${fmt(r.cierre, 0)}</td>
        <td class="n">${fmt(r.inv, 0)}</td><td class="n">${r.prom ? fmt(r.mi, 1) : '—'}</td><td class="n" title="${r.ultimaLote ? esc(r.ultimaLote.lote) + (r.ultimaLote.fecha ? ' · ' + fFecha(r.ultimaLote.fecha) : '') : 'Sin lote registrado'}">${r.ultima ? fmt(r.ultima, 0) : '—'}</td><td class="n hi">${r.nueva ? fmt(r.nueva, 0) : '—'}</td></tr>`).join('')
        || `<tr><td colspan="${per.length + 10 + (verComp ? 1 : 0)}" class="mut">No references.</td></tr>`}

    </table></div>
    <p class="note">Sales: Pedidos OFICA sales history (${ventasVivas ? 'updated from GitHub' : 'saved copy, ' + esc(AB().desde || '') + ' to ' + esc(AB().hasta || '')}) and, since ${esc(String(PB().anio1 || ''))}, the planning Excel. Last month with data: ${nomMesEn(fin).replace('<br>', ' ')}.</p></div>

  <div class="card" id="anEvo"></div>`;

  $('#anPer').onchange = e => { periodoAn = e.target.value; vAnalisis(); };
  $('#anQuitaSelB').onclick = quitarSeleccionAn;
  main.querySelectorAll('[data-ordb]').forEach(el => el.onclick = () => { const k = el.dataset.ordb; ordB = { k, dir: ordB.k === k ? -ordB.dir : 1 }; vAnalisis(); });
  if (nFil) $('#anClr').onclick = () => { filAn = {}; vAnalisis(); };

  main.querySelectorAll('[data-orda]').forEach(el => el.onclick = () => { const k = el.dataset.orda; ordAn = { k, dir: ordAn.k === k ? -ordAn.dir : (COLS_AN.find(c => c.k === k).txt ? 1 : -1) }; vAnalisis(); });
  main.querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = el.ondblclick = e => e.stopPropagation();   /* escribir en la casilla no resalta la fila ni abre el lote */
    el.onkeydown = e => { if (e.key === 'Enter') el.blur(); };
    el.onchange = () => { const k = el.dataset.cat.toUpperCase(), v = el.value.trim(); DB.categorias = DB.categorias || {};
      if (!v || v === catCatalogo(el.dataset.cat)) delete DB.categorias[k]; else DB.categorias[k] = v;
      guardar(); vAnalisis(); toast(v && DB.categorias[k] ? 'Categoría de ' + el.dataset.cat + ': ' + v : 'Vuelve la categoría del catálogo para ' + el.dataset.cat); };
  });

    t.onclick = () => { const r = t.dataset.ref; if (!r) return; selAn.has(r) ? selAn.delete(r) : selAn.add(r);
      main.querySelectorAll('tr.pk').forEach(x => x.classList.toggle('sel', selAn.has(x.dataset.ref))); refrescarTotalB(); pintarEvolucion(); };
  /* QUITAR SELECCION: deselecciona todas las filas de una vez */
    if (t.dataset.key) t.ondblclick = () => verLoteDeProducto(t.dataset.key);
  });

}

// alto del recuadro = encabezado + 10 lineas + total (si la pagina no esta visible queda el maximo fijo del CSS)
function ajustarAltoB(){
  const t = document.querySelector('table.fija2'); if (!t) return;
  const filas = [...t.rows].slice(1).filter(r => r.id !== 'totB'), tot = document.getElementById('totB');
  const h = t.rows[0].offsetHeight + filas.slice(0, 10).reduce((a, r) => a + r.offsetHeight, 0) + (tot ? tot.offsetHeight : 0) + 2;
  if (h > 60) t.parentElement.style.maxHeight = h + 'px';
}
function refrescarTotalB(){ const t = $('#totB'); if (t && ctxAn && ctxAn.totalB) t.outerHTML = ctxAn.totalB(); const b = $('#anQuitaSelB'); if (b) b.style.display = selAn.size ? '' : 'none'; }
function quitarSeleccionAn(){ selAn.clear(); main.querySelectorAll('tr.pk').forEach(x => x.classList.remove('sel')); refrescarTotalB(); pintarEvolucion(); }
// evolucion: lo resaltado (si hay algo resaltado dentro de lo filtrado) o la suma de todo lo filtrado
function pintarEvolucion(){
  const box = $('#anEvo'); if (!box || !ctxAn) return;
  const { filas, refs, rango, per } = ctxAn, elegidas = refs.filter(f => selAn.has(claveRef(f.ref))), usar = elegidas.length ? elegidas : refs;
  const E = evolucion(usar.map(f => f.ref), filas, rango);
  const titulo = usar.length === 1 ? esc(usar[0].ref) + ' — ' + esc(usar[0].desc) : (elegidas.length ? 'Suma de los ' + usar.length + ' productos resaltados' : 'Suma de las ' + usar.length + ' referencias filtradas');
  const negativo = per.some(m => E.I[m] < 0);
  box.innerHTML = `<h3>Evolución: compras, ventas e inventario <span class="sub">${titulo}</span>
      ${elegidas.length ? '<span class="r"><button class="btn s" id="anQuitaSel">Quitar selección</button></span>' : ''}</h3>
    ${usar.length ? `<div class="tw"><table class="fija1">
      <tr><th>Unidades</th>${per.map(m => `<th class="n">${nomMes(m)}</th>`).join('')}<th class="n">Total</th></tr>
      <tr><td><b>Compras recibidas</b></td>${per.map(m => `<td class="n" ${E.L[m] ? `title="${esc([...E.L[m]].join(', '))}" style="background:#e6f6fc;font-weight:600"` : ''}>${E.C[m] ? fmt(E.C[m], 0) : '<span class="mut">·</span>'}</td>`).join('')}<td class="n">${fmt(sum(per.map(m => N(E.C[m]))), 0)}</td></tr>
      <tr><td><b>Ventas</b></td>${per.map(m => `<td class="n">${E.V[m] ? fmt(E.V[m], 0) : '<span class="mut">·</span>'}</td>`).join('')}<td class="n">${fmt(sum(per.map(m => N(E.V[m]))), 0)}</td></tr>
      <tr class="tot"><td>Inventario final</td>${per.map(m => `<td class="n ${E.I[m] < 0 ? 'pos' : ''}">${fmt(E.I[m], 0)}</td>`).join('')}<td></td></tr>
    </table></div>
    <p class="note">El inventario final de cada mes se reconstruye hacia atrás desde el inventario actual (${fmt(sum(usar.map(f => invActual(f.ref))), 0)} und): inventario del mes anterior = inventario − compras + ventas. Pase el cursor sobre una compra para ver de qué lote vino.
      ${negativo ? '<b style="color:var(--bad)">Hay meses en negativo:</b> falta algún lote cargado en la app, o la fecha de llegada de un lote no es la real.' : ''}</p>`
    : '<p class="mut">Filtre o resalte productos para ver su evolución.</p>'}`;
  if (elegidas.length) $('#anQuitaSel').onclick = quitarSeleccionAn;
}
