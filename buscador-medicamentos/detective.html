<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detective clave Farmatodo</title>
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0; background:#f2f5f9; color:#1b2733; }
  header { background:#0d47a1; color:#fff; padding:16px; text-align:center; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  button { padding:12px 20px; font-size:1rem; font-weight:600; color:#fff;
    background:#1565c0; border:none; border-radius:10px; cursor:pointer; }
  #log { background:#111; color:#8f8; font-family:monospace; font-size:.8rem;
    padding:12px; border-radius:8px; margin-top:14px; white-space:pre-wrap; word-break:break-word; min-height:60px; }
  .exito { background:#e8f5e9; border:2px solid #43a047; color:#1b5e20;
    padding:14px; border-radius:10px; margin-top:14px; font-size:.9rem; word-break:break-word; }
  .exito b { font-size:1rem; }
</style>
</head>
<body>
<header><h2>🔍 Detective de la clave de Farmatodo</h2></header>
<main>
  <p>Toca el botón y espera. Al terminar, cópiame TODO lo que aparezca en la cajita verde (o el texto negro si no encuentra nada).</p>
  <button id="btn" onclick="run()">Buscar la clave</button>
  <div id="exito"></div>
  <div id="log"></div>
</main>

<script>
"use strict";
const APP = "vcojeyd2po";
const BASE = "https://www.farmatodo.com.ve";
const INDICES = ["products-vzla", "products-venezuela", "products", "prod-vzla"];
const logEl = document.getElementById("log");
const log = (t) => { logEl.textContent += t + "\n"; };

async function proxyGet(url) {
  const ps = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://corsproxy.io/?url=" + encodeURIComponent(url)
  ];
  for (const p of ps) {
    try { const r = await fetch(p); if (r.ok) return await r.text(); } catch (e) {}
  }
  return "";
}

function absol(u) {
  if (u.startsWith("http")) return u;
  if (u.startsWith("//")) return "https:" + u;
  if (u.startsWith("/")) return BASE + u;
  return BASE + "/" + u;
}

async function testKey(key, idx) {
  const url = "https://" + APP + "-dsn.algolia.net/1/indexes/" + idx + "/query";
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "X-Algolia-Application-Id": APP, "X-Algolia-API-Key": key, "Content-Type": "application/json" },
      body: JSON.stringify({ params: "query=paracetamol&hitsPerPage=1" })
    });
    if (r.status === 200) {
      const d = await r.json();
      return { ok: true, nb: d.nbHits || 0, campos: (d.hits && d.hits[0]) ? Object.keys(d.hits[0]) : [], muestra: (d.hits && d.hits[0]) ? d.hits[0] : null };
    }
    return { ok: false, status: r.status };
  } catch (e) { return { ok: false, status: "red" }; }
}

async function run() {
  document.getElementById("btn").disabled = true;
  logEl.textContent = "";
  document.getElementById("exito").innerHTML = "";

  log("Descargando pagina de Farmatodo (via proxy)...");
  const home = await proxyGet(BASE + "/");
  if (!home) { log("ERROR: no pude descargar la pagina. Reintenta en un momento."); document.getElementById("btn").disabled = false; return; }

  const srcs = [...home.matchAll(/<script[^>]+src="([^"]+\.js[^"]*)"/g)].map((m) => m[1]);
  const bundles = srcs.map(absol).filter((b) => /main|scripts|runtime|vendor|polyfills/i.test(b)).slice(0, 6);
  log("Archivos JS a revisar: " + bundles.length);

  let all = home;
  for (const b of bundles) {
    log("Leyendo " + b.split("/").pop() + " ...");
    all += "\n" + await proxyGet(b);
  }
  log("Codigo descargado: " + all.length + " caracteres");

  let hex = [...new Set([...all.matchAll(/[a-f0-9]{32}/g)].map((m) => m[0]))];
  const score = (h) => {
    const i = all.indexOf(h);
    const w = all.slice(Math.max(0, i - 140), i + 40).toLowerCase();
    let s = 0;
    if (w.includes("vcojeyd2po")) s += 5;
    if (w.includes("algolia")) s += 3;
    if (w.includes("apikey") || w.includes("searchkey") || w.includes("search")) s += 1;
    return s;
  };
  hex.sort((a, b) => score(b) - score(a));
  log("Claves candidatas (32 hex): " + hex.length + ". Probando cada una...");

  let winner = null;
  for (const k of hex.slice(0, 35)) {
    for (const idx of INDICES) {
      const t = await testKey(k, idx);
      if (t.ok && t.nb > 0) { winner = { key: k, idx: idx, nb: t.nb, campos: t.campos, muestra: t.muestra }; break; }
    }
    if (winner) break;
  }

  if (winner) {
    const campos = winner.campos.join(", ");
    const muestra = JSON.stringify(winner.muestra).slice(0, 600);
    document.getElementById("exito").innerHTML =
      '<div class="exito"><b>✅ CLAVE ENCONTRADA (cópiame todo esto):</b><br><br>' +
      "CLAVE = " + winner.key + "<br>INDICE = " + winner.idx + "<br>RESULTADOS = " + winner.nb +
      "<br><br>CAMPOS = " + campos + "<br><br>MUESTRA = " + escapeHtml(muestra) + "</div>";
    log("\n¡Listo! Copia la cajita verde de arriba.");
  } else {
    log("\nNinguna clave funciono automaticamente.");
    const i = all.indexOf("vcojeyd2po");
    if (i >= 0) log("Contexto cerca de vcojeyd2po (copiamelo):\n" + all.slice(i - 60, i + 260));
    else log("No aparecio 'vcojeyd2po' en el codigo descargado.");
  }
  document.getElementById("btn").disabled = false;
}

function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
</script>
</body>
</html>
