<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detective Farmabien 4</title>
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; background:#f2f5f9; color:#1b2733; }
  header { background:#0d47a1; color:#fff; padding:16px; text-align:center; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  button { padding:12px 20px; font-size:1rem; font-weight:600; color:#fff; background:#1565c0; border:none; border-radius:10px; cursor:pointer; }
  .box { background:#111; color:#8f8; font-family:monospace; font-size:.72rem; padding:12px; border-radius:8px; margin-top:14px; white-space:pre-wrap; word-break:break-word; min-height:60px; }
</style>
</head>
<body>
<header><h2>🔍 Detective Farmabien 4 — desempaquetar productos</h2></header>
<main>
  <p>Toca el botón, espera y cópiame TODO el texto de abajo.</p>
  <button id="btn" onclick="run()">Desempaquetar</button>
  <div class="box" id="out"></div>
</main>
<script>
"use strict";
const URL_BUSQUEDA = "https://www.farmabien.com/productos?term=paracetamol";
const out = document.getElementById("out");
const log = (t) => { out.textContent += t + "\n"; };

async function proxyGet(url) {
  const ps = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://corsproxy.io/?url=" + encodeURIComponent(url)
  ];
  for (const p of ps) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 18000);
      const r = await fetch(p, { signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) return await r.text();
    } catch (e) {}
  }
  return "";
}

function contextos(txt, regex, n, radio, excluir) {
  const res = []; let m, count = 0;
  const re = new RegExp(regex, "gi");
  while ((m = re.exec(txt)) && count < n) {
    const c = txt.slice(Math.max(0, m.index - radio), m.index + radio);
    if (excluir && excluir.test(c)) continue;
    res.push(c.replace(/\s+/g, " ")); count++;
  }
  return res;
}

async function run() {
  document.getElementById("btn").disabled = true;
  out.textContent = "";
  log("Descargando y desempaquetando...");
  const html = await proxyGet(URL_BUSQUEDA);
  if (!html) { log("No pude descargar. Reintenta."); document.getElementById("btn").disabled = false; return; }

  // Desempaquetar el "flight" de Next.js (self.__next_f.push([1,"..."]))
  let flight = "";
  const pushes = [...html.matchAll(/self\.__next_f\.push\(\[1,"((?:[^"\\]|\\.)*)"\]\)/g)];
  for (const p of pushes) { try { flight += JSON.parse('"' + p[1] + '"'); } catch (e) {} }
  log("Bloques flight: " + pushes.length + " | tamano desempaquetado: " + flight.length);

  const fuente = flight.length > 1000 ? flight : html;

  // Claves candidatas de nombre y precio
  const claves = {};
  for (const m of fuente.matchAll(/"([a-zA-Z_]{2,20})"\s*:\s*("?[^",{}\[\]]{1,40}"?)/g)) {
    const k = m[1];
    if (/name|nombre|title|titulo|desc|precio|price|pvp|amount|monto|presenta|marca|brand|slug|image|imagen/i.test(k)) {
      claves[k] = (claves[k] || 0) + 1;
    }
  }
  log("\n===== CLAVES vistas (nombre/precio/etc) =====");
  Object.entries(claves).sort((a, b) => b[1] - a[1]).slice(0, 30).forEach(([k, v]) => log("  " + k + " (" + v + ")"));

  log("\n===== CONTEXTOS de 'paracetamol' en los datos (no-meta) =====");
  contextos(fuente, "paracetamol", 8, 220, /og:|meta |apple-mobile|description"|preload/i)
    .forEach((c, i) => log("\n[" + (i + 1) + "] ..." + c + "..."));

  log("\n===== CONTEXTOS de precios =====");
  contextos(fuente, '"(precio|price|pvp|amount|monto|salePrice|regularPrice)"\\s*:', 6, 140)
    .forEach((c, i) => log("\n[" + (i + 1) + "] ..." + c + "..."));

  log("\nListo. Copia TODO este texto.");
  document.getElementById("btn").disabled = false;
}
</script>
</body>
</html>
